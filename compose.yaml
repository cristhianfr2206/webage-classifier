name: webage-classifier
services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]
    security_opt: [no-new-privileges:true]

  redis:
    image: redis:7.4.7-alpine
    user: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  backend:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    networks: [internal, public]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]

  worker-realtime:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    env_file: .env
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "-Q", "realtime", "-n", "realtime@%h", "--loglevel=INFO", "--concurrency=${CELERY_WORKER_CONCURRENCY:-2}"]
    stop_grace_period: 75s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal, public]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app:celery_app inspect ping -d realtime@$$HOSTNAME --timeout=2 | grep -q pong"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker-standard:
    extends:
      service: worker-realtime
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "-Q", "standard", "-n", "standard@%h", "--loglevel=INFO", "--concurrency=${CELERY_WORKER_CONCURRENCY:-2}"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app:celery_app inspect ping -d standard@$$HOSTNAME --timeout=2 | grep -q pong"]

  worker-maintenance:
    extends:
      service: worker-realtime
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "-Q", "maintenance", "-n", "maintenance@%h", "--loglevel=INFO", "--concurrency=1"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app:celery_app inspect ping -d maintenance@$$HOSTNAME --timeout=2 | grep -q pong"]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    networks: [public]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]

  frontend-check:
    build:
      context: ./frontend
      target: devtools
    profiles: [tools]
    networks: [public]
    user: "1000:1000"
    environment:
      HOME: /tmp
    volumes:
      - ./frontend:/app
      - /app/node_modules

  backend-check:
    build:
      context: ./backend
      target: runtime
    profiles: [tools]
    env_file: .env
    networks: [internal]
    user: "1000:1000"
    environment:
      RUFF_CACHE_DIR: /tmp/ruff-cache
      MYPY_CACHE_DIR: /tmp/mypy-cache
    volumes:
      - ./backend:/app

networks:
  internal:
    internal: true
  public:

volumes:
  postgres_data:
  redis_data:
