[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "webage-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.13.2",
  "argon2-cffi==23.1.0",
  "asyncpg==0.29.0",
  "celery[redis]==5.6.2",
  "email-validator==2.2.0",
  "fastapi==0.140.13",
  "httpx==0.27.0",
  "idna==3.18",
  "pydantic-settings==2.4.0",
  "playwright==1.49.1",
  "python-json-logger==2.0.7",
  "redis==6.4.0",
  "sqlalchemy[asyncio]==2.0.32",
  "starlette==1.3.1",
  "tldextract==5.1.2",
  "uvicorn[standard]==0.30.5",
]

[project.optional-dependencies]
dev = [
  "aiosqlite==0.20.0",
  "mypy==1.11.1",
  "pytest==8.3.2",
  "pytest-asyncio==0.23.8",
  "ruff==0.5.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "kombu", "kombu.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["playwright", "playwright.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "app.celery_app",
  "app.tasks",
  "app.queueing",
  "app.browser_celery_app",
  "app.browser_tasks",
  "app.browser_queueing",
  "app.ai_celery_app",
  "app.ai_tasks",
  "app.ai_queueing",
]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
addopts = "-m 'not browser_integration'"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "browser_integration: deterministic tests that launch a real local Chromium browser",
]
